services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Reliable uvicorn --reload on Windows bind mounts (inotify events don't cross the mount).
      WATCHFILES_FORCE_POLLING: "true"
      SURREAL_URL: ws://surrealdb:8000/rpc
    # Dev override: the image's production CMD has no --reload; local dev wants hot reload.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    depends_on:
      - surrealdb

  surrealdb:
    # Pinned to match the 2.x Python client (surrealdb>=2.0,<3.0). The :latest tag moved to
    # SurrealDB 3.x, whose RPC protocol the 2.x client cannot speak (InvalidMessage on connect).
    image: surrealdb/surrealdb:v2.1.4
    # Run as root so RocksDB can write the mounted volume.
    user: root
    command: start --user ${SURREAL_USER:-root} --pass ${SURREAL_PASS:-root} --bind 0.0.0.0:8000 rocksdb:/data/database.db
    ports:
      - "8001:8000"
    volumes:
      - surreal_data:/data

volumes:
  # One-time note: if this machine previously ran the old :latest (SurrealDB 3.x) image, the
  # existing volume holds a 3.x on-disk format that 2.x cannot read. Remove it once with
  # `docker compose down && docker volume rm <project>_surreal_data` before `up`.
  surreal_data:
